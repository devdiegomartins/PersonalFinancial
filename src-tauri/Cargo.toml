[package]
name = "personal_financial"
version = "0.1.0"
description = "A Personal Financial App"
authors = ["Diego Martins <diegoribeiromartins@gmail.com>"]
edition = "2021"

[lib]
name = "personal_financial_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crypt_service", "file_service", "utils"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
